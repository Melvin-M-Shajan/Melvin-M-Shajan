<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Melvin's AI system map</title>
  <desc id="desc">Signals flow into retrieval and memory, then through a supervisor to specialist agents and an observability layer.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.5" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#0d1327"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d7ff"/>
      <stop offset="0.55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a66cff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#d9f8ff"/>
      <stop offset="0.25" stop-color="#65dcff"/>
      <stop offset="0.7" stop-color="#5967ff"/>
      <stop offset="1" stop-color="#211b5a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#73d8ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65dcff"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#panel)" stroke="#2b3654"/>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#grid)"/>
  <text x="48" y="48" fill="#7183a6" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing="3">HOW I SHIP INTELLIGENCE</text>
  <circle cx="1110" cy="44" r="4" fill="#31d7ff" filter="url(#glow)"/>
  <text x="1125" y="49" fill="#5e708f" font-family="JetBrains Mono, Consolas, monospace" font-size="11">SYSTEM ONLINE</text>

  <g fill="none" stroke="url(#signal)" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrow)">
    <path d="M184 175 C230 175 242 175 282 175"/>
    <path d="M438 175 C478 175 488 175 530 175"/>
    <path d="M670 175 C710 175 722 175 762 175"/>
    <path d="M918 175 C958 175 968 175 1008 175"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(46 112)">
      <rect width="138" height="126" rx="18" fill="#0c1628" stroke="#263957"/>
      <circle cx="26" cy="28" r="6" fill="#31d7ff" filter="url(#glow)"/>
      <text x="42" y="33" fill="#dcecff" font-size="15" font-weight="700">SIGNAL</text>
      <text x="20" y="68" fill="#8293af" font-size="12">text · voice</text>
      <text x="20" y="88" fill="#8293af" font-size="12">events · data</text>
      <text x="20" y="108" fill="#8293af" font-size="12">intent · state</text>
    </g>

    <g transform="translate(282 112)">
      <rect width="156" height="126" rx="18" fill="#0c1628" stroke="#2e4166"/>
      <circle cx="26" cy="28" r="6" fill="#45c8ff" filter="url(#glow)"/>
      <text x="42" y="33" fill="#dcecff" font-size="15" font-weight="700">CONTEXT</text>
      <text x="20" y="68" fill="#8293af" font-size="12">graph retrieval</text>
      <text x="20" y="88" fill="#8293af" font-size="12">vector memory</text>
      <text x="20" y="108" fill="#8293af" font-size="12">structured data</text>
    </g>

    <g transform="translate(530 101)">
      <rect width="140" height="148" rx="22" fill="#111836" stroke="#5967ff" stroke-width="1.5"/>
      <circle cx="70" cy="43" r="25" fill="url(#core)" filter="url(#glow)"/>
      <circle cx="70" cy="43" r="11" fill="#f5fdff" fill-opacity="0.88"/>
      <text x="70" y="94" text-anchor="middle" fill="#f0f7ff" font-size="15" font-weight="700">SUPERVISOR</text>
      <text x="70" y="116" text-anchor="middle" fill="#8ea2c7" font-size="11">state · policy · route</text>
      <text x="70" y="133" text-anchor="middle" fill="#6f83a8" font-size="10">LANGGRAPH CONTROL</text>
    </g>

    <g transform="translate(762 112)">
      <rect width="156" height="126" rx="18" fill="#0c1628" stroke="#403c79"/>
      <circle cx="26" cy="28" r="6" fill="#7b7cff" filter="url(#glow)"/>
      <text x="42" y="33" fill="#dcecff" font-size="15" font-weight="700">SPECIALISTS</text>
      <text x="20" y="68" fill="#8293af" font-size="12">retrieval · SQL</text>
      <text x="20" y="88" fill="#8293af" font-size="12">tools · memory</text>
      <text x="20" y="108" fill="#8293af" font-size="12">reason · act</text>
    </g>

    <g transform="translate(1008 112)">
      <rect width="146" height="126" rx="18" fill="#0c1628" stroke="#493c75"/>
      <circle cx="26" cy="28" r="6" fill="#a66cff" filter="url(#glow)"/>
      <text x="42" y="33" fill="#dcecff" font-size="15" font-weight="700">TRUST</text>
      <text x="20" y="68" fill="#8293af" font-size="12">evals · traces</text>
      <text x="20" y="88" fill="#8293af" font-size="12">guardrails · cost</text>
      <text x="20" y="108" fill="#8293af" font-size="12">human control</text>
    </g>
  </g>

  <g transform="translate(250 294)" font-family="JetBrains Mono, Consolas, monospace" font-size="11">
    <rect width="700" height="34" rx="17" fill="#0a1424" stroke="#263957"/>
    <circle cx="24" cy="17" r="4" fill="#31d7ff"/>
    <text x="38" y="21" fill="#92a8c9">OBSERVABILITY BUS</text>
    <text x="190" y="21" fill="#607392">/</text>
    <text x="210" y="21" fill="#8095b6">latency</text>
    <text x="285" y="21" fill="#607392">/</text>
    <text x="305" y="21" fill="#8095b6">decisions</text>
    <text x="395" y="21" fill="#607392">/</text>
    <text x="415" y="21" fill="#8095b6">tool calls</text>
    <text x="510" y="21" fill="#607392">/</text>
    <text x="530" y="21" fill="#8095b6">quality</text>
    <text x="598" y="21" fill="#607392">/</text>
    <text x="618" y="21" fill="#8095b6">audit</text>
  </g>
</svg>
